# Continuous integration: every push / pull request is linted, tested, built and its
# infrastructure code validated. Detection rules are code too - their tests run here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[infra,dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Detection rules validate against attack scenarios
        run: aegis rules validate
      - name: Demo smoke test
        run: aegis demo --scenario all --no-llm

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (trains the ML models inside the build)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aegis:ci
          load: true
      - name: Smoke-test the image
        run: docker run --rm aegis:ci aegis rules validate

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and schema-validate the manifests
        run: |
          for overlay in local eks; do
            echo "== $overlay"
            kubectl kustomize deploy/k8s/overlays/$overlay > /tmp/$overlay.yaml
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7-alpine \
              -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0 < /tmp/$overlay.yaml
          done
