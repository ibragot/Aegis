# Prometheus scrapes every Aegis service's /metrics endpoint every 15s.
# Under docker compose, `dns_sd_configs` resolves a service name to ALL of its
# replicas (e.g. both auth-analyzer containers), so scaling needs no config change.
# On Kubernetes the same job uses `kubernetes_sd_configs` (see deploy/k8s/base/prometheus-scrape.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aegis-workers
    dns_sd_configs:
      - names: [generator, collector, auth-analyzer, cloud-analyzer, network-analyzer, ml-inference, indexer,
                correlator, investigator]
        type: A
        port: 9100
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: aegis-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { service: api }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
