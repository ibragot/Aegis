# OpenTelemetry Collector: receives spans from every Aegis service over OTLP/gRPC,
# batches them and forwards them to Jaeger. Swapping Jaeger for AWS X-Ray, Grafana
# Tempo, Honeycomb, ... only changes the exporter here - not the application code.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
