# Local Kubernetes (kind / minikube):
#   docker build -t aegis:local .
#   kind create cluster --name aegis && kind load docker-image aegis:local --name aegis
#   kubectl apply -k deploy/k8s/overlays/local
#   kubectl -n aegis port-forward svc/api 8000:80
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegis
resources:
  - ../../base
  - infra.yaml
patches:
  # small local cluster: fewer replicas, no autoscaling floor of 2 for the API
  - target: {kind: Deployment, name: api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: Deployment, name: collector}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
