apiVersion: v1
kind: Namespace
metadata:
  name: aegis
  labels:
    # Pod Security Admission: reject privileged pods in this namespace (the very thing AEG-K8S-001 detects!)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis
  # On EKS the eks overlay adds an IRSA annotation (eks.amazonaws.com/role-arn) so pods get
  # short-lived AWS credentials for S3 - no static access keys anywhere.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-config
data:
  AEGIS_BUS: kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_PARTITIONS: "6"
  KAFKA_REPLICATION_FACTOR: "1"
  DATABASE_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
  REDIS_URL: redis://redis:6379/0
  AEGIS_ARCHIVE_BUCKET: ""
  AEGIS_ML_MODEL: ensemble
  AEGIS_LLM_MODEL: claude-opus-5-5
  AEGIS_GENERATOR_EPS: "3"
  AEGIS_ATTACK_INTERVAL_S: "300"
  AEGIS_LOG_LEVEL: INFO
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
# The Secret `aegis-secrets` (optional) holds ANTHROPIC_API_KEY, AEGIS_API_TOKEN and, on EKS, the
# DATABASE_URL with the real password. Create it out-of-band, never commit it:
#   kubectl -n aegis create secret generic aegis-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... --from-literal=AEGIS_API_TOKEN=$(openssl rand -hex 24)
# On EKS prefer the External Secrets Operator syncing from AWS Secrets Manager (see deploy/terraform).
