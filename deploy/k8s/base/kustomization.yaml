apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegis
labels:
  - pairs: {app.kubernetes.io/part-of: aegis}
    includeSelectors: false
resources:
  - config.yaml
  - workers.yaml
  - api.yaml
  - scaling.yaml
  - network-policies.yaml
images:
  - name: aegis
    newName: aegis
    newTag: local
