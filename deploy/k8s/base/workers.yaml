# Generated layout: one Deployment per Aegis microservice (same image, different args).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generator
  labels: {app.kubernetes.io/name: generator, app.kubernetes.io/component: worker}
spec:
  # Synthetic lab traffic. Remove this Deployment when ingesting real logs.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: generator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: generator, app.kubernetes.io/component: worker}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9100"}
    spec:
      serviceAccountName: aegis
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: generator
          image: aegis
          args: ["aegis", "run", "generator"]
          envFrom:
            - configMapRef: {name: aegis-config}
            - secretRef: {name: aegis-secrets, optional: true}
          env:
            - {name: AEGIS_SERVICE_NAME, value: generator}
          ports: [{name: metrics, containerPort: 9100}]
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
